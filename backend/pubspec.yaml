name: hobbishort
description: HobbiSport - Community-driven hobby and sports tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Functional programming (Either)
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0        # ready for v2 auth

  # Local storage
  sqflite: ^2.3.2
  shared_preferences: ^2.2.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Navigation
  go_router: ^13.2.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
