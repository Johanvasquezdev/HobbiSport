name: hobbisport
description: A modern hobby and sports tracker app built with Flutter and Clean Architecture.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  flutter_bloc: ^8.1.4

  # Dependency Injection
  get_it: ^7.7.0

  # Firebase (ready for integration)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # Utils
  dartz: ^0.10.1
  equatable: ^2.0.5
  path: ^1.9.0
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
